name: CI

on:
  push:
    branches: [main, gelistirme]
    # Yalnızca belge değişen gönderimlerde derlenecek bir şey yok.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

# gelistirme'de yeni gönderim, aynı dalda bekleyen/süren eski çalışmayı iptal eder: son çalışma önceki
# commit'leri de kapsar. main'de süren çalışma kesilmez (main'e günde bir kez toplu gönderilir).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: .NET 10 kur
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Paketleri indir
        run: dotnet restore bitirme/bitirme.sln

      - name: Derle
        run: dotnet build bitirme/bitirme.sln --configuration Release --no-restore

      - name: Testler
        run: dotnet test --solution bitirme/bitirme.sln --configuration Release --no-build

  # Dockerfile bozulursa yayın öncesi değil, ilk gönderimde fark edilir.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker imajını derle
        run: docker build --tag moodica-web:ci .
